app = "marketspace"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  PYTHON_VERSION = "3.12.4
  MARKETSPACE_ADMIN_KEY = "ms_enterprise_2026"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

[[vm]]
  memory = "512mb"
